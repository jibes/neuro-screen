<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f8fafc" />
		<meta name="description" content="Neuropsychologisches Screening-Tool mit 15 kognitiven Tests – läuft vollständig im Browser." />
		<title>NeuroScreen</title>
		<script>
			// Apply the colour theme before first paint (keep in sync with src/lib/theme.svelte.ts)
			(function () {
				var pref = 'system';
				try { pref = localStorage.getItem('neuroscreen-theme') || 'system'; } catch (e) {}
				var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020617');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
